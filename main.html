<!DOCTYPE html>
<html lang = "en"?>
<head> 
    <meta charset = "UTF-8"/>
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0, maximum-scale = 1.0, user-scalable = no"/>
    <meta name = "theme-color"  content = "#0b0f19"/>
    <meta name = "description" cotent = "UAV/Telemetry & GCS"/>
    <title> AetherLink - UAV Telemetry GCS</title>
    <link rel = "manifest" href = "manifest.json"/>
    <link rel = "icon" href="data:image/svg+xml", <svg xmlns = 'https://www.w3.org/2000/svg' viewbox=' 0 0 100 100'><text y = '.9em' font- size ='90'></text></svg>/>
    <style>
        :root {
            --bg: #0b0f19;
            --bg2: #111927;
            --bg3: #1a2234;
            --panel: #151c2c;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --accent3: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --glass: rgba(21, 28, 44, 0.85);
            --radius: 12px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
        }


        * {box-sizing: border-box; margin: 0; padding: 0;}
        html, body {
            height : 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }


        /*SCREENS*/
        .screen {display: none; height: 100%; width: 100%; position: absolute; inset: 0;}
        .screen.active { display: flex; flex-direction: column;}
        

        /* LANDING / SELECT */
        #screen-select {
            background: radial-gradient(ellipse at 30% 20%, #1a2744 0%, var(--bg) 60%);
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-y: auto;
        }

        .select-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .select-header h1 {
            font-size: clamp(2rem, 5ww, 2.3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #00d4ff, #7c3aed 60%, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .select-header p {
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 520px;
            margin: 0 auto;
        }

        .vehicle-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18x;
            max-width: 1100px;
            width: 100%;
        }

        .vehicle-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .vehicle-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(0,212,255,0.08));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .vehicle-card:hover {
            border-color: var(--accent);
            transform: translate(-4px);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.15);
        }

        .vehicle-card:hover::before {opacity: 1;}
        .vehicle-card .icon {
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vehicle-card h3 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .vehicle-card p {
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.4;
        }

        .vehicle-card .tag {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(0,212,255,0.12);
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.03em;
        }


        /* MAIN APP*/
        #screen-app {
            background: var(--bg);
        }


        .topbar {
            height: 52px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
            z-index: 50;
        }

        .logo {
            font-weight: 800;
            font-size: 1.15rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .vehicle-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg3);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .vehicle-badge svg {width: 18px; height: 18px;}
        .status-pills {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
        }

        .pill {
            display : flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg3);
            border: 1px solid var(--border);
        }

        .pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
        }

        .pill.ok .dot {background: var(--accent3);}
        .pill.warn .dot {background: var(--warn);}
        .pill.err .dot {background: var(--danger);}
        .pill.armed { 
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            color: #fca5a5;
        }

        .pill.armed .dot {background: var(--danger); animation: pulse 1s infinite;}
        @keyframes pulse {
            0%, 100%{opacity: 1;}
            50% {opacity: 0.4;}
        }

        .btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {border-color: var(--accent); color: var(--accent);}
        .btn.primary {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            color: white;
        }

        .btn.primary:hover {filter: brightness(1.1);} 
        .btn.danger { 
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: #fca5a5;
        }

        .btn.danger:hover {background: var(--danger); color: white;}
        .btn.success {
            background: rgba(34, 19794, 0.2);
            border-color: var(--accent3);
            color: #86efac;
        }


        /*layout*/
        .main-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 288px 1fr 300px;
            grid-template-rows: 1fr;
            overflow: hidden;
            min-height: 0;
        }

        @media (max-width: 1200px) {
            .main-layout {grid-template-columns: 240px 1fr 260px;}
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            
            .sidebar-left, .sidebar-right {
                background: var(--bg2);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .sidebar-right { border-right: none; border-left: 1px solid var(--border); }

            .panel {
                padding: 14px;
                border-bottom: 1px solid var(--border);
            }

            .panel:last-child {border-bottom: none;}
            .panel-title { 
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
                margin-bottom: 10px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }


            /* Telemetry Numbers*/
            .telem-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .telem-item {
                background: var(--bg3);
                border-radius: 8px;
                padding: 8px 10px;
                border: 1px solid transparent; 
            }

            .telem-item .label {
                font-size: 0.65rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            .telem-item .value {
                font-family: var(-mono);
                font-size: 1.05rem;
                font-weight: 600;
                margin-top: 2px;
            }

            .telem-item .unit {
                font-size: 0.7rem;
                color: var(--muted);
                margin-left: 2px;
            }

            .telem-item.wide { grid-column: 1/ -1;}


            /* Battery bar */
            .battery-bar {
                height: 8px;
                background: var(--bg);
                border-radius: 4px;
                overflow: hidden;
                margin-top: 6px;
            }

            .battery-fill {
                height:100%;
                border-radius: 4px;
                transition: width 0.4s, background 0.4s;
            }


            /* Center area*/
            .center-area {
                display: flex;
                flex-direction: column;
                min-width: 0;
                background: #080c14;
                position: relative;
            }


            /*Tabs*/
            .view-tabs {
                display: flex;
                background: var(--bg2);
                border-bottomn: 1px solid var(--border);
                flex-shrink: 0;
                overflow-x: auto;
            }

            .view-tab {
                padding: 10px 18px;
                font-size: 0.8rem;
                font-weight: 600;
                color: var(--muted);
                cursor: pointer;
                border-bottomn: 2px solid transparent;
                white-space: nowrap;
                transition: all 0.15s;
            }

            .view-tab:hover { color: var(--text);}
            .view-tab.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }

            .view-content {
                flex: 1;
                position: relative;
                overflow: hidden;
                min-height: 0;
            }

            .view-pane {
                position: absolute;
                inset: 0;
                display: none;
                padding: 12px;
            }

            .view-pane.active {display: flex; flex-direction: column; }


            /* Instruments layout */
            .instruments-row {
                display: flex;
                gap: 12px;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                flex: 1;
                min-height: 0;
            }

            .instrument {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                box-shadow: 0 4px 24px rgba(0,0,0,0.35);
            }

            .instrument canvas {
                border-radius: 50%;
                background: #0a0e16;
            }

            .instrument-label {
                font-size: 0.7rem;
                color: var(--muted);
                margin-top: 6px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-weight: 600;
            }


            /* Map */
            #map-canvas {
                width: 100%;
                height: 100%;
                border-radius: 12px;
                background: #0d1520;
            }

            .map-overlay {
                position: absolute;
                top: 20px;
                left: 20px;
                background:  var(--glass);
                backdrop-filter: blur(8px);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 10px 14px;
                font-size: 0.8rem;
                z-index: 5;
                pointer-events: None;
            }

            .map-overlay .cord {
                font-family: var(--mono);
                font-size: 0.5rem;
            }


            /* Graphs */
            .graph-container {
                flex: 1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                min-height: 0;
            }

            @media(max-width: 700px) {
                .graph-container {grid-template-columns: 1fr;}
            }

            .graph-card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            .graph-card h4 {
                font-size: 0.75 rem;
                color: var(--muted);
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .graph-card canvas {
                flex: 1;
                width: 100% !important;
                min-height: 120px;
            }
        }
    </style>
</head>
</html>
