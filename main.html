<!DOCTYPE html>
<html lang = "en"?>
<head> 
    <meta charset = "UTF-8"/>
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0, maximum-scale = 1.0, user-scalable = no"/>
    <meta name = "theme-color"  content = "#0b0f19"/>
    <meta name = "description" cotent = "UAV/Telemetry & GCS"/>
    <title> AetherLink - UAV Telemetry GCS</title>
    <link rel = "manifest" href = "manifest.json"/>

        :root {
            --bg: #0b0f19;
            --bg2: #111927;
            --bg3: #1a2234;
            --panel: #151c2c;
            --accent: #00d4ff;

            --warn: #f59e0b;
            --danger: #ef4444;

        * {box-sizing: border-box; margin: 0; padding: 0;}
